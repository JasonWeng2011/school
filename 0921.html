<html>
    <head>
        <title>0921-css簡介</title>
        <!--html樣式表-->
        <style>/* css的註解 */
        /* css又稱樣式表 */
        /* 選擇器:selector 有三種 標籤名稱、#id、.class */
        /*
        display: block/inline/inline-block;
        width: px; pixel像素
        height:px;

        color:前景顏色
        background-color:背景顏色

        顏色設定方法:
        1. 英文單字
        2. rgb(紅0~255,綠0~255，藍0~255)
        3. rgba(紅0~255,綠0~255,藍0~255,可見度0~1)//0全透明~1不透明
        4. 色碼 #RRGGBB 00~FF
        5. hsl(色相0~360,彩度0~100%,明度0~100%)
        6. hsla(色相0~360,彩度0~100%,明度0~100%,可見度0~1)0全透明~1不透明

        */
        p {
            background-color:  lightgray;
        }
        #p1 {
            background-color: rgba(255,255,0,0.5);
        }
        .c1 {
            color: brown;
        }
        .d1 {
            background-color: hsl(240,100%,30%);color: #FFFFFF;
            height: 50px;
            width: 50px;
            
        }
        .s1 {
            background-color: coral;
            height: 50px;
            width: 50px;
            display: inline-block;
        }



        </style>
        <body>
            <p id="p1" class="c1">第一個段落<br>123</p>
            <p style="color: blue">第二個段落</p>
            <p class="c1" style="color:brown">第三個段落</p>
            <div class="d1">1</div>
            <div class="d1">1</div>
            <span class="s1">2</span>
            <span class="s1">2</span>

        </body>
    </head>
</html>
