<body><!--網頁內容-->
<p>帥氣小火<br></p> <!--不用/br-->

<p>ensp&ensp;帥哥</p><!--半形空白-->

<p>格式標籤:<b>粗體</b> <i>斜體</i> <u>底線</u> <s>刪除線</s> <b><i>粗斜體</i></b> </p>
<p>語意標籤:<strong>重要</strong> <em>強調</em> <ins>插入</ins> <del>刪除</del> <sub>下標</sub> <sup>上標</sup> <mark>標記</mark> </p>
<p>列表<br>

</ul>
有序列表ordered-list:type="1,A,a,I,i":<ol type="A" start="3"> <!--從c開始-->
<li>項目</li>
<li>項目</li>
<li>項目</li>
<li>項目</li>
</ol>

</p>
