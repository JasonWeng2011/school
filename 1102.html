<!DOCTYPE html>
<html>
    <head>
        <title>1102-JavaScript輸出與輸入</title>
        <style>
            /* css */
            #ans{
                width:300px;
                height:100px;
                background-color:red;
            }
        </style>
        <script>
            /*js:javascript 多行註解 */
            //JS單行註解
            function say() {
                name=prompt("請問你叫什麼名子?");
                
                
                if(confirm("你確定你叫"+name+"嗎?")){
                    alert("你好,"+name);

                }
                else {
                    alert("請重新打招呼!")
                }
                }
                /* 問問題並回答，得到字串的答案
			ans = prompt("你叫什麼名字？");
			console.log(ans + "是" + typeof(ans) + "類型的");
			得到兩種結果：string/null(object)
			*/
			/* 確認是否
			ans = confirm("你確定嗎？");
			console.log(ans + "是" + typeof(ans) + "類型的");
			得到兩種結果：true/false
			*/
			//單純輸出
			//alert("你好");
			//console.log("hello");
			//document.getElementById("ans").innerHTML="hello";

            
            function setVol(){
                vol=document.getElementById("vol_num").innerHTML = document.getElementById("vol_range").value;
            }
            function setBGColor(){
                document.getElementById("ans").style.backgroundColor = document.getElementById("bgcolor").value;
            }
            function add(){
                n1=parseInt(document.getElementById("n1").value);
                n2=parseInt(document.getElementById("n2").value);
                document.getElementById("add_ans").innerHTML=(n1+n2)
                
            }
            function ready(){
                setVol();
            }
        </script>
    </head>
    <body onload="ready()">
        <buttom onclick="say();">打招呼</buttom>
        <div id="ans"></div>
        <hr>
        <input type="text" value="text"><br>
        <input type="password" value="password"><br>
        <input type="number" value="123"><br>
        <input type="date" value="2026-11-02"><br>
        <input type="datetime-local" value="2026-11-02T08:57:21"><br>
        <input type="color" value="#FF0000" id="bgcolor" oninput="setBGColor()"><br>
        <input type="text" value="text"><br>
        <input type="range" id="vol_range" min="1" max="100" value="50" onchange="setVol();"><span id="vol_num"></span>
        <hr>
        <input type="number" id="n1"> + <input type="number" id="n2"><button onclick="add()">等於</button><span id="add_ans"></span>

        
    </body>
</html>
