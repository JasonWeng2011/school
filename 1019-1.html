<!DOCTYPE html>
<html>
    <head>
        <title>1019-位置與圖層</title>
        <style>
            /* position: relative 是相對於自己原本的座標
               position: absolute 是相對於(有設定position的父容器 或 body)的絕對座標
                 可設定top/left 或 bottom/right
                 z-index 為圖層，數字大的在上;數字一樣則是後生成的元素在上。
               */
            #dad{
                border:2px solid black;
                width:300px;
                height:300px;
                position:relative; /*相對於自己原來的位置*/
                top: 20px;
                left:20px;
            }
            #d1{
                border:3px solid red;
                width:100px;
                height:100px;
                background-color: hsla(0deg, 100%, 50%, 0.7); /*半透明紅色*/
                position:relative; /*單純為了圖層效果，設定哪個都行*/
                z-index: 100;
            }
            #d2{
                border:3px solid blue;
                width:100px;
                height:100px;
                position:relative; /*相對於自己原來的位置(在紅色下方)*/
                top:30px;
                left:30px;

            }
            #d3{
                border:3px solid grey;
                width:100px;
                height:100px;
                background-color: hsla(120deg, 100%, 50%, 1); /*不透明綠色*/
                position:absolute; /*相對於dad的絕對位置*/
                z-index: 99;
                top:20px;
                left:20px;
                

            }
            #d4{
                background-color:  hsla(60deg,100%, 50%, 1);
                width:100px;
                height:100px; 
                position:absolute;/*相對於dad的絕對位置*/
                right: 10px;
                bottom:10px;
            }
            #uncle{
                border:2px dashed black;
                width:100px;
                height:100px;
                 position:absolute; /*相對於body的絕對位置*/
                top:10px;
                left:10px;
            }


        </style>
    </head>
    <body>
        <div id="dad">
            <div id="d1"></div>
            <div id="d2"></div>
            <div id="d3"></div>
            <div id="d4"></div>

        </div>
        <div id="uncle"></div>

    </body>
</html>
