<html>
    <head>
        <title>1012-CSS漸層與動畫</title>
        <style>
            div{
                width:200px;
                height:100px;
                margin-bottom:10px;
                border:1px solid black;}
                #d1{ /*線性漸層*/
                    background-image:linear-gradient(90deg ,orange,yellow,cyan,rgb(255, 0, 242),red);
                }
                #d2{ /*方向0~360deg, 多個顏色用逗點分開*/
                    background-image: linear-gradient(90deg ,orange,yellow,cyan,rgb(255, 0, 242),red);
                    width:400px;
                    height:50px;
                }
                #d3{ /*輻射漸層*/
                    background-image: radial-gradient(yellow,white,black);
                    height:200px
                }
                #d4{/*預設會隨著容器改變形狀，第一參數設定circle可強制為圓形*/
                    background-image: radial-gradient(circle,yellow,white,black);

                }
                #d5{/*圓錐漸層*/
                    background-image: conic-gradient(red,green,blue,red);
                }
                #d6{/*第一參數可調整起始位置*/
                    background-image: conic-gradient(from 90deg,red,green,blue,red);
                }
                #d7{
                    background-image: linear-gradient(90deg,red 30%,white 30%,white 70%,blue 70%);
                }
                #d8{
                    background-image: radial-gradient(circle,red 33%,white 33%,white 66%,blue 66%);
                }
                #d9{
                    background-image: conic-gradient(red 33%,white 33%,white 66%,blue 66%);
                }
                #d10{
                    background-image: repeating-linear-gradient(45deg,orange 3%,yellow 6%,cyan 9%,rgb(255, 0, 242) 12%,red 15% );
                }
                #d11{
                    background-image:repeating-radial-gradient(circle,yellow 10%,cyan 20%,rgb(255, 0, 242) 30%)
                }
                #d12{
                    background-image: repeating-conic-gradient(yellow 30%,cyan 35%,rgb(255, 0, 242) 40%);
                }
                /*  動畫   */
                @keyframes k1 {
                    0% {background-image:linear-gradient(90deg ,yellow,cyan 50%,rgb(255, 0, 242));}
                    10% {background-image:linear-gradient(90deg ,yellow,cyan 40%,rgb(255, 0, 242));}
                    24% {background-image:linear-gradient(90deg ,yellow,cyan 30%,rgb(255, 0, 242));}
                    36% {background-image:linear-gradient(90deg ,yellow,cyan 20%,rgb(255, 0, 242));}
                    50% {background-image:linear-gradient(90deg ,yellow,cyan 10%,rgb(255, 0, 242));}
                    65% {background-image:linear-gradient(90deg ,yellow,cyan 0%,rgb(255, 0, 242));}
                    76% {background-image:linear-gradient(90deg ,yellow,cyan 90%,rgb(255, 0, 242));}
                    83% {background-image:linear-gradient(90deg ,yellow,cyan 80%,rgb(255, 0, 242));}
                    94% {background-image:linear-gradient(90deg ,yellow,cyan 70%,rgb(255, 0, 242));}
                    100% {background-image:linear-gradient(90deg ,yellow,cyan 60%,rgb(255, 0, 242));}
                    }
                    #a1 { /*動畫名稱 播一組要多久 要播幾次 線性速度*/
                        animation: k1 1s infinite linear;
                    }
                    @keyframes k2 {
                        0% {background-image:linear-gradient(36deg,red,yellow,cyan)}
                        10% {background-image:linear-gradient(72deg,red,yellow,cyan)}
                        24% {background-image:linear-gradient(108deg,red,yellow,cyan)}
                        36% {background-image:linear-gradient(144deg,red,yellow,cyan)}
                        50% {background-image:linear-gradient(180deg,red,yellow,cyan)}
                        65% {background-image:linear-gradient(216deg,red,yellow,cyan)}
                        76% {background-image:linear-gradient(252deg,red,yellow,cyan)}
                        83% {background-image:linear-gradient(288deg,red,yellow,cyan)}
                        94% {background-image:linear-gradient(324deg,red,yellow,cyan)}
                        100% {background-image:linear-gradient(360deg,red,yellow,cyan)}
                    }
                    #a2 { 
                        animation: k2 1s infinite linear;
                    }
                    @keyframes k3 {
                        0% {background-image:radial-gradient(circle,red,yellow 50%,cyan)}
                        25% {background-image:radial-gradient(circle,red,yellow 60%,cyan)}
                        50% {background-image:radial-gradient(circle,red,yellow 70%,cyan)}
                        75% {background-image:radial-gradient(circle,red,yellow 60%,cyan)}
                        100% {background-image:radial-gradient(circle,red,yellow 50%,cyan)}
                    }
                    #a3{
                        animation: k3 1s infinite linear;
                    }
                     @keyframes k4 {
                        0% {background-image:repeating-linear-gradient(red 30%,yellow 35%,cyan 40%)}
                        
                        50% {background-image:repeating-linear-gradient(yellow 30%, cyan 35%,red 40%)}
                        
                        100% {background-image:repeating-linear-gradient(cyan 30%,red 35%,yellow 40%)}
                     }
                     #a4{
                        animation: k4 1s infinite linear;
                     }
                     @keyframes k5 {
                        0% {background-image:repeating-radial-gradient(circle,red 30%,yellow 35%,cyan 40%)}
                        
                        50% {background-image:repeating-radial-gradient(circle,yellow 30%, cyan 35%,red 40%)}
                        
                        100% {background-image:repeating-radial-gradient(circle,cyan 30%,red 35%,yellow 40%)}
                     }
                     #a5{
                        animation: k5 1s infinite linear;
                     }
                      @keyframes k6 {
                        0% {background-image:repeating-conic-gradient(red 30%,yellow 35%,cyan 40%)}
                        
                        50% {background-image:repeating-conic-gradient(yellow 30%, cyan 35%,red 40%)}
                        
                        100% {background-image:repeating-conic-gradient(cyan 30%,red 35%,yellow 40%)}
                     }
                      #a6{
                        animation: k6 1s infinite linear;
                      }






                
                
                </style>
    </head>
    <body>
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
        <div id="d5"></div>
        <div id="d6"></div>
        <hr>
        <div id="d7"></div>
        <div id="d8"></div>
        <div id="d9"></div>
        <div id="d10"></div>
        <div id="d11"></div>
        <div id="d12"></div>
        <hr>
        <div id="a1"></div>
        <div id="a2"></div>
        <div id="a3"></div>
        <div id="a4"></div>
        <div id="a5"></div>
        <div id="a6"></div>

    </body>
</html>
